<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem de Estoque - Filme Stretch</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #eef1f5; margin: 0; padding: 16px; color: #0f172a;
  }
  .container { max-width: 720px; margin: 0 auto; padding-bottom: 90px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: #64748b; font-size: 13px; margin-bottom: 16px; }

  .card {
    background: #fff; border-radius: 12px; padding: 14px 16px;
    margin-bottom: 10px; box-shadow: 0 1px 3px rgba(15,23,42,0.06);
  }
  .card-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px; gap: 8px;
  }
  .code-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .code { font-weight: 700; font-size: 15px; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .tag {
    font-size: 10px; background: #dbeafe; color: #1d4ed8;
    padding: 2px 8px; border-radius: 10px; font-weight: 600; letter-spacing: .3px;
  }
  .info { font-size: 11px; color: #94a3b8; white-space: nowrap; }

  .inputs { display: flex; gap: 10px; }
  .input-group { flex: 1; min-width: 0; }
  .input-group label {
    display: block; font-size: 11px; color: #64748b;
    margin-bottom: 4px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .4px;
  }
  .stepper {
    display: flex; align-items: center; border: 1px solid #e2e8f0;
    border-radius: 9px; overflow: hidden; background: #fff;
  }
  .stepper button {
    width: 34px; height: 38px; border: none; background: #f8fafc;
    font-size: 18px; color: #334155; cursor: pointer; flex-shrink: 0;
    font-weight: 600; user-select: none;
  }
  .stepper button:active { background: #e2e8f0; }
  .stepper input {
    flex: 1; border: none; text-align: center; font-size: 16px;
    font-weight: 700; width: 100%; min-width: 0; padding: 8px 0;
    outline: none; background: #fff; color: #0f172a;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper input[type=number] { -moz-appearance: textfield; }

  .actions {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(238,241,245,0.95);
    backdrop-filter: blur(8px); padding: 12px 16px;
    display: flex; gap: 8px;
    box-shadow: 0 -4px 20px rgba(15,23,42,0.06);
    z-index: 10;
  }
  .actions-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; width: 100%; }
  .btn {
    padding: 13px 16px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: opacity .15s;
  }
  .btn:active { opacity: .8; }
  .btn-primary { background: #25d366; color: #fff; flex: 2; }
  .btn-secondary { background: #fff; color: #334155; border: 1px solid #e2e8f0; flex: 1; }

  #preview {
    display: none; position: fixed; inset: 0;
    background: rgba(15,23,42,0.75); z-index: 100;
    overflow: auto; padding: 20px 16px;
  }
  #preview.active { display: block; }
  .preview-content {
    max-width: 640px; margin: 0 auto; background: #fff;
    border-radius: 14px; padding: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .preview-title { font-size: 13px; color: #64748b; margin-bottom: 10px; text-align: center; }
  #previewImg { width: 100%; display: block; border-radius: 8px; border: 1px solid #e2e8f0; }
  .preview-actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px;
  }
  .preview-actions button {
    padding: 12px; border-radius: 10px; border: none; font-weight: 600;
    font-size: 13px; cursor: pointer;
  }
  .pa-whats { background: #25d366; color: #fff; grid-column: 1 / -1; }
  .pa-download { background: #0f172a; color: #fff; }
  .pa-close { background: #f1f5f9; color: #334155; }
  .pa-copy { background: #f1f5f9; color: #334155; }
</style>
</head>
<body>

<div class="container">
  <h1>📦 Contagem de Estoque</h1>
  <div class="subtitle" id="dateLabel"></div>
  <div id="list"></div>
</div>

<div class="actions">
  <div class="actions-inner">
    <button class="btn btn-secondary" id="resetBtn">Limpar</button>
    <button class="btn btn-primary" id="generateBtn">Gerar relatório</button>
  </div>
</div>

<div id="preview">
  <div class="preview-content">
    <div class="preview-title">Prévia do relatório</div>
    <img id="previewImg" alt="Relatório">
    <div class="preview-actions">
      <button class="pa-whats" id="whatsBtn">📲 Enviar pelo WhatsApp</button>
      <button class="pa-download" id="downloadBtn">⬇ Baixar imagem</button>
      <button class="pa-copy" id="copyBtn">📋 Copiar texto</button>
      <button class="pa-close" id="closeBtn">Fechar</button>
    </div>
  </div>
</div>

<script>
/* ========== MATERIAIS ========== */
const MATERIALS = [
  { id: 'a', code: '0401025V', tag: 'Shpx',   full: 216, half: null },
  { id: 'b', code: '0400020V', tag: '',       full: 112, half: 56 },
  { id: 'c', code: '0450525V', tag: '',       full: 126, half: 63 },
  { id: 'd', code: '0401025V', tag: 'Normal', full: 126, half: 63 },
  { id: 'e', code: '0400025V', tag: '',       full: 112, half: 56 },
  { id: 'f', code: '0400030V', tag: '',       full: 112, half: 56 },
  { id: 'g', code: '0350025V', tag: '',       full: 90,  half: null },
  { id: 'h', code: '0350825V', tag: '',       full: 126, half: null },
];

const STORAGE_KEY = 'estoque-contagem-v1';
let currentCanvas = null;

/* ========== PERSISTÊNCIA ========== */
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}

/* ========== RENDER LISTA ========== */
function renderList() {
  const state = loadState();
  const container = document.getElementById('list');
  container.innerHTML = '';

  MATERIALS.forEach(mat => {
    const saved = state[mat.id] || {};
    const fullVal = saved.full || 0;
    const halfVal = saved.half || 0;

    const card = document.createElement('div');
    card.className = 'card';

    const infoText = mat.half === null
      ? `${mat.full} bobinas/inteiro`
      : `${mat.full} inteiro · ${mat.half} meio`;

    card.innerHTML = `
      <div class="card-header">
        <div class="code-wrap">
          <span class="code">${mat.code}</span>
          ${mat.tag ? `<span class="tag">${mat.tag}</span>` : ''}
        </div>
        <div class="info">${infoText}</div>
      </div>
      <div class="inputs">
        <div class="input-group">
          <label>Inteiros</label>
          <div class="stepper">
            <button type="button" data-action="dec" data-target="full-${mat.id}">−</button>
            <input type="number" min="0" inputmode="numeric" id="full-${mat.id}" value="${fullVal}">
            <button type="button" data-action="inc" data-target="full-${mat.id}">+</button>
          </div>
        </div>
        ${mat.half !== null ? `
        <div class="input-group">
          <label>Meios</label>
          <div class="stepper">
            <button type="button" data-action="dec" data-target="half-${mat.id}">−</button>
            <input type="number" min="0" inputmode="numeric" id="half-${mat.id}" value="${halfVal}">
            <button type="button" data-action="inc" data-target="half-${mat.id}">+</button>
          </div>
        </div>` : ''}
      </div>
    `;
    container.appendChild(card);
  });

  container.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      const cur = parseInt(target.value) || 0;
      const next = btn.dataset.action === 'inc' ? cur + 1 : Math.max(0, cur - 1);
      target.value = next;
      persist();
    });
  });

  container.querySelectorAll('input[type=number]').forEach(inp => {
    inp.addEventListener('input', persist);
    inp.addEventListener('blur', () => {
      if (inp.value === '' || isNaN(parseInt(inp.value))) inp.value = 0;
      persist();
    });
  });
}

function persist() {
  const state = {};
  MATERIALS.forEach(mat => {
    const fullEl = document.getElementById(`full-${mat.id}`);
    const halfEl = document.getElementById(`half-${mat.id}`);
    state[mat.id] = {
      full: parseInt(fullEl?.value) || 0,
      half: mat.half !== null ? (parseInt(halfEl?.value) || 0) : 0
    };
  });
  saveState(state);
}

/* ========== COLETA DE DADOS ========== */
function collectData() {
  return MATERIALS.map(mat => {
    const fullEl = document.getElementById(`full-${mat.id}`);
    const halfEl = document.getElementById(`half-${mat.id}`);
    const full = parseInt(fullEl?.value) || 0;
    const half = mat.half !== null ? (parseInt(halfEl?.value) || 0) : 0;
    const totalUnits = full * mat.full + half * (mat.half || 0);
    return { mat, full, half, totalUnits };
  });
}

/* ========== FORMATAÇÃO ========== */
function plural(n, sing, plur) { return `${n} ${n === 1 ? sing : plur}`; }

function formatShort(full, half, mat) {
  const parts = [];
  if (full > 0) parts.push(plural(full, 'inteiro', 'inteiros'));
  if (mat.half !== null && half > 0) parts.push(plural(half, 'meio', 'meios'));
  if (parts.length === 0) return 'Sem estoque';
  return parts.join(' + ');
}

function formatWa(full, half, mat) {
  const name = mat.code + (mat.tag ? ` (${mat.tag})` : '');
  const parts = [];
  if (full > 0) parts.push(plural(full, 'inteiro', 'inteiros'));
  if (mat.half !== null && half > 0) parts.push(plural(half, 'meio', 'meios'));
  if (parts.length === 0) return `Sem estoque de ${name}`;
  return `Temos ${parts.join(' e ')} de ${name}`;
}

function formatDate() {
  const d = new Date();
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatDateLong() {
  const d = new Date();
  const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  return `${dias[d.getDay()]}, ${formatDate()}`;
}

/* ========== CANVAS ========== */
function roundRect(ctx, x, y, w, h, r, corners) {
  let tl, tr, br, bl;
  if (corners) { [tl, tr, br, bl] = corners; }
  else { tl = tr = br = bl = r; }
  ctx.beginPath();
  ctx.moveTo(x + tl, y);
  ctx.lineTo(x + w - tr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + tr);
  ctx.lineTo(x + w, y + h - br);
  ctx.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
  ctx.lineTo(x + bl, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - bl);
  ctx.lineTo(x, y + tl);
  ctx.quadraticCurveTo(x, y, x + tl, y);
  ctx.closePath();
}

function generateCanvas() {
  const data = collectData();
  const scale = 2;
  const width = 720;
  const pad = 28;
  const headerH = 150;
  const cardH = 104;
  const gap = 12;
  const itemsH = data.length * (cardH + gap) - gap;
  const footerH = 90;
  const height = headerH + 24 + itemsH + footerH;

  const canvas = document.createElement('canvas');
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // Fundo geral
  ctx.fillStyle = '#f1f5f9';
  ctx.fillRect(0, 0, width, height);

  // Header com gradiente escuro
  const grad = ctx.createLinearGradient(0, 0, width, headerH);
  grad.addColorStop(0, '#0f172a');
  grad.addColorStop(1, '#1e293b');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, headerH);

  // Faixa de acento (verde WhatsApp)
  ctx.fillStyle = '#25d366';
  ctx.fillRect(0, 0, width, 6);

  // Título
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText('Contagem de Estoque', pad, 76);

  // Subtítulo
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText('Filme Stretch  ·  ' + formatDateLong(), pad, 104);

  // Linha fina decorativa
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(pad, 124, 60, 2);

  // Cards dos materiais
  let y = headerH + 24;

  data.forEach(d => {
    const hasStock = d.full > 0 || d.half > 0;
    const cardX = pad;
    const cardW = width - pad * 2;

    // Sombra
    ctx.fillStyle = 'rgba(15,23,42,0.06)';
    roundRect(ctx, cardX, y + 3, cardW, cardH, 16);
    ctx.fill();

    // Card
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, cardX, y, cardW, cardH, 16);
    ctx.fill();

    // Barra de acento à esquerda
    ctx.fillStyle = hasStock ? '#25d366' : '#cbd5e1';
    roundRect(ctx, cardX, y, 6, cardH, 16, [16, 0, 0, 16]);
    ctx.fill();

    // Código do material
    ctx.fillStyle = hasStock ? '#0f172a' : '#94a3b8';
    ctx.font = 'bold 22px ui-monospace, "SF Mono", Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(d.mat.code, cardX + 28, y + 44);

    // Tag
    if (d.mat.tag) {
      ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      const tagText = d.mat.tag.toUpperCase();
      const tw = ctx.measureText(tagText).width + 18;
      ctx.fillStyle = hasStock ? '#dbeafe' : '#f1f5f9';
      roundRect(ctx, cardX + 28, y + 56, tw, 22, 11);
      ctx.fill();
      ctx.fillStyle = hasStock ? '#1d4ed8' : '#94a3b8';
      ctx.fillText(tagText, cardX + 28 + 9, y + 71);
    }

    // Info capacidade
    ctx.fillStyle = '#94a3b8';
    ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    const capInfo = d.mat.half !== null
      ? `${d.mat.full} bobinas/inteiro  ·  ${d.mat.half}/meio`
      : `${d.mat.full} bobinas por pallet`;
    ctx.fillText(capInfo, cardX + 28, y + cardH - 16);

    // Badges à direita
    const rightEdge = cardX + cardW - 24;

    if (hasStock) {
      let cursor = rightEdge;

      // Badge meios (laranja)
      if (d.mat.half !== null && d.half > 0) {
        const bw = 92, bh = cardH - 32, by = y + 16;
        const bx = cursor - bw;
        ctx.fillStyle = '#fff7ed';
        roundRect(ctx, bx, by, bw, bh, 12);
        ctx.fill();

        ctx.fillStyle = '#fb923c';
        roundRect(ctx, bx + 20, by + 8, bw - 40, 3, 2);
        ctx.fill();

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ea580c';
        ctx.font = 'bold 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillText(String(d.half), bx + bw / 2, by + 44);

        ctx.fillStyle = '#9a3412';
        ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillText('MEIOS', bx + bw / 2, by + bh - 10);

        cursor = bx - 10;
      }

      // Badge inteiros (azul)
      if (d.full > 0) {
        const bw = 92, bh = cardH - 32, by = y + 16;
        const bx = cursor - bw;
        ctx.fillStyle = '#eff6ff';
        roundRect(ctx, bx, by, bw, bh, 12);
        ctx.fill();

        ctx.fillStyle = '#60a5fa';
        roundRect(ctx, bx + 20, by + 8, bw - 40, 3, 2);
        ctx.fill();

        ctx.textAlign = 'center';
        ctx.fillStyle = '#2563eb';
        ctx.font = 'bold 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillText(String(d.full), bx + bw / 2, by + 44);

        ctx.fillStyle = '#1e40af';
        ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillText('INTEIROS', bx + bw / 2, by + bh - 10);
      }
    } else {
      ctx.textAlign = 'right';
      ctx.fillStyle = '#cbd5e1';
      ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillText('SEM ESTOQUE', rightEdge, y + cardH / 2 + 5);
    }

    y += cardH + gap;
  });

  // Rodapé
  y += 12;
  const withStock = data.filter(d => d.full > 0 || d.half > 0).length;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#475569';
  ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText(`${withStock} de ${data.length} materiais com estoque`, width / 2, y + 22);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText('Gerado automaticamente  ·  ' + formatDate(), width / 2, y + 44);

  return canvas;
}

/* ========== TEXTO WHATSAPP ========== */
function generateWaText() {
  const data = collectData();
  const lines = [`*Contagem de Estoque - ${formatDate()}*`, ''];
  data.forEach(d => {
    lines.push('• ' + formatWa(d.full, d.half, d.mat));
  });
  return lines.join('\n');
}

/* ========== PREVIEW ========== */
function openPreview() {
  currentCanvas = generateCanvas();
  document.getElementById('previewImg').src = currentCanvas.toDataURL('image/png');
  document.getElementById('preview').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closePreview() {
  document.getElementById('preview').classList.remove('active');
  document.body.style.overflow = '';
}

/* ========== AÇÕES ========== */
function downloadImage() {
  if (!currentCanvas) return;
  const url = currentCanvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = `contagem-estoque-${formatDate().replace(/\//g,'-')}.png`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function shareWhatsApp() {
  if (!currentCanvas) return;
  const text = generateWaText();
  try {
    const blob = await new Promise(res => currentCanvas.toBlob(res, 'image/png'));
    const file = new File([blob], `contagem-${formatDate().replace(/\//g,'-')}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text });
      return;
    }
  } catch (e) {}
  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

async function copyText() {
  const text = generateWaText();
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById('copyBtn');
    const orig = btn.textContent;
    btn.textContent = '✓ Copiado!';
    setTimeout(() => btn.textContent = orig, 1500);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
}

/* ========== INIT ========== */
document.getElementById('dateLabel').textContent = formatDateLong();
renderList();
document.getElementById('generateBtn').addEventListener('click', openPreview);
document.getElementById('closeBtn').addEventListener('click', closePreview);
document.getElementById('downloadBtn').addEventListener('click', downloadImage);
document.getElementById('whatsBtn').addEventListener('click', shareWhatsApp);
document.getElementById('copyBtn').addEventListener('click', copyText);
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Zerar todas as contagens?')) return;
  MATERIALS.forEach(mat => {
    document.getElementById(`full-${mat.id}`).value = 0;
    const h = document.getElementById(`half-${mat.id}`);
    if (h) h.value = 0;
  });
  persist();
});
document.getElementById('preview').addEventListener('click', (e) => {
  if (e.target.id === 'preview') closePreview();
});
</script>
</body>
</html>
